[build]
  command = "npm run build"
  publish = "dist"

# Fallback SPA: cualquier ruta que no sea un archivo estático real
# (ej. /clients/abc-123, /q/xyz) debe servir index.html para que
# React Router resuelva la navegación en el cliente -- sin esto,
# recargar la página en una ruta interna devuelve 404 de Netlify en
# vez de la app. Redundante con public/_redirects (que Vite copia a
# dist/_redirects en cada build) pero se declara aquí también para que
# el comportamiento de deployment quede completo y explícito en un
# solo archivo versionado, sin depender únicamente de que
# public/_redirects no se pierda o modifique por accidente.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Función que consulta el tipo de cambio oficial del BCN (/.netlify/functions/bcn-rate).
[functions]
  directory = "netlify/functions"

# Cabeceras de seguridad para toda la app.
# CSP: solo scripts propios; conexiones a la propia app y a Supabase; fuentes de Google.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; connect-src 'self' https://*.supabase.co wss://*.supabase.co; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'"
